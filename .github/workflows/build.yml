name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: bun install

      - name: Build UI
        run: bun run build:ui

      - name: Build Tauri Release Binary
        run: bun run build:release

      - name: Verify Executable Binary
        run: |
          if (!(Test-Path "src-tauri/target/release/nikkepwned.exe")) { throw "src-tauri/target/release/nikkepwned.exe not found" }
