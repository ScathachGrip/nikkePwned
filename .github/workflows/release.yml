name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: bun install

      - name: Build Release Binary
        run: bun run build:release

      - name: Verify Executable Binary
        run: |
          if (!(Test-Path "src-tauri/target/release/nikkepwned.exe")) { throw "src-tauri/target/release/nikkepwned.exe not found" }

      - name: Package Release Artifacts
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item -Path "src-tauri/target/release/nikkepwned.exe" -Destination "dist/nikkepwned.exe" -Force
          Copy-Item -Path "src-tauri/target/release/nikkepwned.exe" -Destination "dist/nikkepwned-win_x64.exe" -Force
          Compress-Archive -Path "dist/nikkepwned.exe", "dist/nikkepwned-win_x64.exe" -DestinationPath "dist/nikkepwned-release.zip" -Force

      - name: Read Version
        id: pkg
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          "version=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Tag if Missing
        run: |
          $tag = "${{ steps.pkg.outputs.version }}"
          $exists = git ls-remote --tags origin $tag
          if ($exists) {
            Write-Host "Tag $tag already exists on remote"
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/nikkepwned-release.zip
            src-tauri/target/release/nikkepwned.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
